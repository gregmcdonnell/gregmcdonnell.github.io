name: Deploy to GitHub Pages

on:
  # Deploy whenever main changes.
  push:
    branches: [main]
  # Allow running it by hand from the Actions tab.
  workflow_dispatch:

# The permissions the deploy-pages action needs, and nothing more.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push cancels an older one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, and fails if it's out of sync.
      - run: npm ci

      - run: npm run build

      # Packages dist/ as the Pages artifact.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
