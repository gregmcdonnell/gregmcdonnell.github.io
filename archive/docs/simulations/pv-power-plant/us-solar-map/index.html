<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- <script src="https://cdn.jsdelivr.net/npm/heatmapjs@2.0.2/heatmap.min.js"></script> -->
    <script src="myheatmap.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/proj4@2.20.8/dist/proj4.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <script src="https://unpkg.com/leaflet-graticule"></script>
    <style>

        html, body {
            background: #0d1117;
            color: white;
        }
        #controls {
            position: relative;
            display: inline-block;
            z-index: 10;
        }
        
        #container {
            position: relative;
        }

        #map-wrapper {
            background: transparent;
            overflow: hidden;
            position: absolute;
            top: 0;
            pointer-events: none;
            /* border: 2px solid black; */
        }
        
        #svg-us-container{
            position: absolute;
            inset: 0;
            /* border: 2px solid blue; */
        }
        
        #heatmap-us {
            /* position: absolute; */
            inset: 0;
            z-index: 9;
        }

        .slider-parent {
            font-family: "Space Grotesk", sans-serif;
            display: grid;
            grid-template-columns: 50px 150px auto;
            align-items: center;
            gap: 12px;
            width: 100%;
        }
        #map {
            /* width: 700px; */
            height: 800px;
            z-index: 0;
        }
    </style>
</head>

<body>
    <main>
        <div id="controls">
            <div class="slider-parent">
                <span>Radius</span>
                <input type="range" class="slider" id="radius" min="0" max="40" step="0.001" value="0" />
                <span id="val-radius">0</span>
            </div>
            <div class="slider-parent">
                <span>Max</span>
                <input type="range" class="slider" id="max" min="1" max="1000" step="1" value="0" />
                <span id="val-max">0</span>
            </div>
        </div>
        <div id="container">
            <div id="map"></div>
            <div id="map-wrapper">
                <!-- <div id="svg-us-container"></div> -->
                <div id="heatmap-us" ></div>
            </div>
        </div>
    </main>

    <!-- <script type="module" src="./js/ui/mapUS.js"></script> -->
    <script type="module" src="main.js"></script>
</body>

</html>
