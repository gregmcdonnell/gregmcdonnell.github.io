<body>
    <div id="debug"></div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"

<script type="module">
    import * as THREE from "three";
    import * as CANNON from "cannon-es";
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const debug = document.getElementById("debug");

    // ---------------------------------
    // Scene
    // ---------------------------------

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x303040);

    const camera = new THREE.PerspectiveCamera(
        60,
        window.innerWidth / window.innerHeight,
        0.1,
        100
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setAnimationLoop(animate);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    camera.position.set(4, 3, 6);
    controls.target.set(0, 1, 0);
    controls.update();


    // ---------------------------------
    // Lights
    // ---------------------------------

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
    directionalLight.position.set(5, 10, 5);
    directionalLight.castShadow = true;
    directionalLight.shadow.mapSize.width = 1024;
    directionalLight.shadow.mapSize.height = 1024;
    // directionalLight.shadow.camera.near = 0.5;
    // directionalLight.shadow.camera.far = 50;
    scene.add(directionalLight);

    // ---------------------------------
    // Physics
    // ---------------------------------

    const world = new CANNON.World({
        // gravity: new CANNON.Vec3(0, -9.82, 0)
        allowSleep: true
    });

    // Ground
    const globalStaticBody = new CANNON.Body({
        mass: 0,
        type: CANNON.Body.STATIC
    });
    const groundBody = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Plane()
    });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    world.addBody(groundBody);

    // Box rigidbody

    const boxShape = new CANNON.Box(new CANNON.Vec3(1, 0.1, 0.25));

    const boxBody = new CANNON.Body({
        mass: 1,
        shape: boxShape,
        position: new CANNON.Vec3(-4, 3, 0)
    });

    boxBody.angularVelocity.set(3, 5, 2);
    boxBody.angularDamping = 0.05;

    world.addBody(boxBody);


    const cylShape = new CANNON.Cylinder(0.25, 0.25, 1, 32);

    const tBody = new CANNON.Body({
        mass: 1,
        position: new CANNON.Vec3(0, 3, 0)
    });
    tBody.addShape(cylShape, new CANNON.Vec3(0, 0, 0));
    tBody.addShape(boxShape, new CANNON.Vec3(0, 0.5, 0));
    // Give it some spin
    tBody.angularVelocity.set(0.6, 10, 0.9);
    tBody.angularDamping = 0.05;

    world.addBody(tBody);

    const tBody2 = cloneCannonBody(tBody);
    tBody2.position.set(3, 3, -3);
    tBody2.angularVelocity.set(0.6, 20, 0);
    world.addBody(tBody2);
    const ppConstraint = new CANNON.PointToPointConstraint(
        tBody2, new CANNON.Vec3(0, -.5, 0),
        globalStaticBody, tBody2.pointToWorldFrame(new CANNON.Vec3(0, -.5, 0))
    );
    world.addConstraint(ppConstraint);


    // ---------------------------------
    // Three meshes
    // ---------------------------------
    world.bodies.forEach(body => {
        const threeObject = createThreeObjectFromBody(body);
        scene.add(threeObject);
        if (body.threeObject) {
            body.addEventListener('sleep', (event) => {
                body.threeObject.material.color.set(0x808080);
            });
            body.addEventListener('wakeup', (event) => {
                body.threeObject.material.color.set(0xf3d19a);
            });
        }

    });


    // const boxMesh = new THREE.Mesh(
    //     new THREE.BoxGeometry(boxShape.halfExtents.x * 2, boxShape.halfExtents.y * 2, boxShape.halfExtents.z * 2),
    //     new THREE.MeshStandardMaterial({
    //         color: 0x44aaff
    //     })
    // );
    // boxMesh.castShadow = true;
    // boxMesh.receiveShadow = true;
    // scene.add(boxMesh);

    // const gyroGroup = new THREE.Group();
    // const cylMesh = new THREE.Mesh(
    //     new THREE.CylinderGeometry(0.25, 0.25, 1, 32),
    //     new THREE.MeshStandardMaterial({
    //         color: 0x44aaff
    //     })
    // );
    // const cylBox = new THREE.Mesh(
    //     new THREE.BoxGeometry(boxShape.halfExtents.x * 2, boxShape.halfExtents.y * 2, boxShape.halfExtents.z * 2),
    //     new THREE.MeshStandardMaterial({
    //         color: 0x44aaff
    //     })
    // );
    // cylBox.position.y = .5;
    // cylBox.castShadow = true;
    // cylBox.receiveShadow = true;
    // cylMesh.castShadow = true;
    // cylMesh.receiveShadow = true;
    // gyroGroup.add(cylBox);
    // gyroGroup.add(cylMesh);
    // scene.add(gyroGroup);

    const groundMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({
            color: 0x808080
        })
    );
    groundMesh.receiveShadow = true;
    groundMesh.rotation.x = -Math.PI / 2;
    scene.add(groundMesh);

    function createThreeObjectFromBody(
        body,
        material = new THREE.MeshStandardMaterial({ color: 0xf3d19a }),
        shadow = true
    ) {
        const meshes = [];

        for (let i = 0; i < body.shapes.length; i++) {
            const shape = body.shapes[i];

            let geometry;

            switch (shape.type) {
                case CANNON.Shape.types.BOX: {
                    const he = shape.halfExtents;
                    geometry = new THREE.BoxGeometry(
                        he.x * 2,
                        he.y * 2,
                        he.z * 2
                    );
                    break;
                }

                case CANNON.Shape.types.SPHERE: {
                    geometry = new THREE.SphereGeometry(shape.radius, 32, 16);
                    break;
                }

                case CANNON.Shape.types.CYLINDER: {
                    geometry = new THREE.CylinderGeometry(
                        shape.radiusTop,
                        shape.radiusBottom,
                        shape.height,
                        shape.numSegments
                    );

                    break;
                }

                // default:
                //     throw new Error(`Unsupported shape type: ${shape.type}`);
            }

            const mesh = new THREE.Mesh(geometry, material);

            const offset = body.shapeOffsets[i];
            if (offset) {
                mesh.position.set(offset.x, offset.y, offset.z);
            }

            const orientation = body.shapeOrientations[i];
            if (orientation) {
                mesh.quaternion.set(
                    orientation.x,
                    orientation.y,
                    orientation.z,
                    orientation.w
                );
            }
            mesh.castShadow = shadow;
            mesh.receiveShadow = shadow;
            meshes.push(mesh);
        }

        let threeObj;

        if (meshes.length === 1) {
            threeObj = meshes[0];
        } else {
            threeObj = new THREE.Group();
            threeObj.add(...meshes);
        }
        threeObj.material = material;
        // Attach to the body for easy lookup
        body.threeObject = threeObj;

        return threeObj;
    }

    function cloneCannonBody(body) {
        const bodyClone = new CANNON.Body({
            mass: body.mass,
            material: body.material,
            position: body.position.clone(),
            quaternion: body.quaternion.clone(),
            linearDamping: body.linearDamping,
            angularDamping: body.angularDamping
        });

        body.shapes.forEach((shape, i) => {
            bodyClone.addShape(shape, body.shapeOffsets[i]);
        });
        return bodyClone;
    }

    // ---------------------------------
    // Animation
    // ---------------------------------

    const fixedTimeStep = 1 / 60;
    let lastTime;

    function animate(time) {

        if (lastTime !== undefined) {
            const dt = (time - lastTime) / 1000;
            world.step(fixedTimeStep, dt);
        }

        lastTime = time;

        for (const body of world.bodies) {
            if (!body.threeObject) continue;

            body.threeObject.position.copy(body.position);
            body.threeObject.quaternion.copy(body.quaternion);
        }

        renderer.render(scene, camera);
    }

    // ---------------------------------
    // Resize
    // ---------------------------------

    window.addEventListener("resize", () => {

        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();

        renderer.setSize(window.innerWidth, window.innerHeight);

    });
    const mouseBody = new CANNON.Body({
        mass: 0,
        shape: new CANNON.Sphere(0.1),
        collisionFilterGroup: 0, // Prevent it from colliding with other objects
    });
    world.addBody(mouseBody);

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDragging = false;
    let constraint = null;

    const canvas = document.querySelector('canvas');

    // Cannon-es Raycast options and result container
    const cannonRaycastResult = new CANNON.RaycastResult();
    const raycastOptions = {
        skipBackfaces: true
    };

    function onMouseDown(event) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const origin = raycaster.ray.origin;
        const direction = raycaster.ray.direction;

        // Calculate a far point along the ray (e.g., 100 units away)
        const farPoint = new THREE.Vector3().copy(origin).addScaledVector(direction, 100);

        // Convert to Cannon vectors
        const from = new CANNON.Vec3(origin.x, origin.y, origin.z);
        const to = new CANNON.Vec3(farPoint.x, farPoint.y, farPoint.z);

        // 3. Reset result and perform the Cannon-es raycast
        cannonRaycastResult.reset();
        const hasHit = world.raycastClosest(from, to, raycastOptions, cannonRaycastResult);

        if (hasHit) {
            const pickedBody = cannonRaycastResult.body;
            if (pickedBody.type != CANNON.Body.DYNAMIC)
                return;
            const hitPoint = cannonRaycastResult.hitPointWorld; // Cannon.Vec3

            // 4. Attach your PointToPointConstraint using the physics data directly
            mouseBody.position.copy(hitPoint);

            const localOffset = pickedBody.pointToLocalFrame(hitPoint);
            constraint = new CANNON.PointToPointConstraint(
                pickedBody, localOffset,
                mouseBody, new CANNON.Vec3(0, 0, 0)
            );
            world.addConstraint(constraint);
            isDragging = true;
            controls.enabled = false;
        }
    }
    function threeToCannonVec(vectorThree) {
        return new CANNON.Vec3(vectorThree.x, vectorThree.y, vectorThree.z);
    }

    function onMouseMove(event) {
        if (!isDragging) return;

        const rect = canvas.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);

        const origin = raycaster.ray.origin;
        const direction = raycaster.ray.direction;

        const rayDir = threeToCannonVec(direction)
        const intersection = intersectPlane(threeToCannonVec(camera.position), rayDir, mouseBody.position, rayDir);
        console.log(intersection);
        mouseBody.position = intersection;
    }

    function onMouseUp() {
        if (isDragging) {
            isDragging = false;
            world.removeConstraint(constraint);
            constraint = null;
        }
        controls.enabled = true;
    }

    function intersectPlane(rayOrigin, rayDir, planePoint, planeNormal) {
        const denom = planeNormal.dot(rayDir);

        // Parallel ray
        if (Math.abs(denom) < 1e-6) {
            return null;
        }

        const t = planePoint.vsub(rayOrigin).dot(planeNormal) / denom;

        // Behind ray origin
        if (t < 0) {
            return null;
        }

        return rayOrigin.vadd(rayDir.scale(t));
    }

    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove); // Track mouse even if it leaves canvas mid-drag
    window.addEventListener('mouseup', onMouseUp);

    window.addEventListener("keydown", (event) => {
        if (event.code === "KeyG") {
            world.gravity.y = world.gravity.y == 0 ? -9.81 : 0;
        }
    });

    function applyGyroscopicTorque(body) {

        const tempVec = new CANNON.Vec3();
        // set local ang vel (omegaBody)
        body.quaternion.conjugate().vmult(body.angularVelocity, tempVec);

        // set local ang momentum (Lbody)
        tempVec.set(
            body.inertia.x * tempVec.x,
            body.inertia.y * tempVec.y,
            body.inertia.z * tempVec.z
        );

        // set world ang momentum (Lworld)
        body.quaternion.vmult(tempVec, tempVec);

        // set gyro torque
        body.angularVelocity.cross(tempVec, tempVec);

        body.torque.vsub(tempVec, body.torque);
    }

    function computeGyroscopicTorque(body, out = new CANNON.Vec3()) {

        // World angular velocity
        const omegaWorld = body.angularVelocity;
        showVec3("angVel", omegaWorld);
        // Rotate into body coordinates
        const omegaBody = new CANNON.Vec3();
        body.quaternion.conjugate().vmult(omegaWorld, omegaBody);

        // L_body = I * omega_body
        const Lbody = new CANNON.Vec3(
            body.inertia.x * omegaBody.x,
            body.inertia.y * omegaBody.y,
            body.inertia.z * omegaBody.z
        );

        // Rotate back to world coordinates
        const Lworld = new CANNON.Vec3();
        body.quaternion.vmult(Lbody, Lworld);

        // τ = -ω × L
        omegaWorld.cross(Lworld, out);
        out.scale(-1, out);

        return out;
    }

    world.addEventListener("preStep", () => {

        world.bodies.forEach((body, i) => {
            applyGyroscopicTorque(body);
        });
        // const gyro = computeGyroscopicTorque(cylBody);

        // cylBody.torque.vadd(gyro, cylBody.torque);
        // if (isDragging) {

        // }

    });

    function showVec3(name, v) {
        debug.textContent =
            `${name}: ${v.x.toFixed(2)}, ${v.y.toFixed(2)}, ${v.z.toFixed(2)}
${v.length()}`;
    }

    controls.enableZoom = false;

    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();

        const speed = 0.01;
        const offset = new THREE.Vector3(e.deltaX * speed, -e.deltaY * speed, 0).applyQuaternion(camera.quaternion);
        // offset.add(new THREE.Vector3(0, -e.deltaY * speed, 0));
        camera.position.add(offset);
        controls.target.add(offset);
    }, { passive: false });
</script>
